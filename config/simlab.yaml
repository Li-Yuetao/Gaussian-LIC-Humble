# The source image is 1920x1200. Gaussian-LIC resizes image/depth to
# 640x480 so the existing SPNet 480x640 TensorRT engine can be reused.
# Intrinsics are scaled independently by sx=1/3 and sy=0.4.
width: 640
height: 480
fx: 481.0666666667
fy: 577.2
cx: 323.4666666667
cy: 236.72

select_every_k_frame: 5
depth_completion: true
patch_size: 10
max_depth: 20

sh_degree: 3
white_background: false
random_background: false
convert_SHs_python: false
compute_cov3D_python: false
lambda_erank: 0
scaling_scale: 1

position_lr: 0.00016
feature_lr: 0.0050
opacity_lr: 0.05
scaling_lr: 0.005
rotation_lr: 0.001
lambda_dssim: 0.2
optimize_depth: true
lambda_depth: 0.005
iteration_decay: false

apply_exposure: false
exposure_lr: 0.001
skybox_points_num: 0
skybox_radius: 1000
